name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start mock API
        run: |
          docker compose up -d --build

      - name: Wait for mock API
        run: |
          sleep 5

      - name: Run parallel non-mobile tests with HTML report
        run: |
          pytest tests/qa_agent tests/banking/test_transfer_hybrid.py --override-ini="addopts=" -n 2 -v -s --html=reports/html/report.html --self-contained-html

      - name: Generate execution dashboard
        run: |
          python utils/generate_execution_dashboard.py